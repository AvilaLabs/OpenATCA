# Fuzz harness for the decoders. A workspace of its own, outside the main one, so that
# libfuzzer-sys is never a dependency of any shipped crate (docs/FUZZING.md).
[package]
name = "oa-fuzz"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
oa-asterix = { path = "../crates/oa-asterix" }
oa-adsb = { path = "../crates/oa-adsb" }
oa-feed = { path = "../crates/oa-feed" }
oa-grib2 = { path = "../crates/oa-grib2" }
oa-j2k = { path = "../crates/oa-j2k" }
oa-tiff = { path = "../crates/oa-tiff" }
oa-xml = { path = "../crates/oa-xml" }
oa-tbfm = { path = "../crates/oa-tbfm" }
oa-tfms = { path = "../crates/oa-tfms" }
oa-fixm = { path = "../crates/oa-fixm" }
oa-tar = { path = "../crates/oa-tar" }
oa-zip = { path = "../crates/oa-zip" }
oa-awc = { path = "../crates/oa-awc" }
oa-json = { path = "../crates/oa-json" }
oa-csv = { path = "../crates/oa-csv" }
oa-arinc424 = { path = "../crates/oa-arinc424" }
oa-nasr = { path = "../crates/oa-nasr" }
oa-notam = { path = "../crates/oa-notam" }
oa-mva = { path = "../crates/oa-mva" }
oa-nam = { path = "../crates/oa-nam" }

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "asterix"
path = "fuzz_targets/asterix.rs"
test = false
doc = false
bench = false

