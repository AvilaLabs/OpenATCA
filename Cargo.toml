[workspace]
resolver = "2"
# The fuzz crate is its own workspace (it alone may use libfuzzer-sys); see docs/FUZZING.md.
exclude = ["fuzz", "validation/oa-alloc-check", "validation/oa-creusot-check", "validation/oa-feed-work-check", "validation/oa-vectors"]
members = [
    "crates/oa-csv",
    "crates/oa-geo",
    "crates/oa-ieee",
    "crates/oa-math",
    "crates/oa-nasr",
    "crates/oa-arinc424",
    "crates/oa-sha256",
    "crates/oa-zip",
    "crates/oa-deflate",
    "crates/oa-xml",
    "crates/oa-json",
    "crates/oa-tar",
    "crates/oa-adsb",
    "crates/oa-modes",
    "crates/oa-airspace",
    "crates/oa-feed",
    "crates/oa-fixm",
    "crates/oa-tbfm",
    "crates/oa-stdds",
    "crates/oa-replay",
    "crates/oa-notam",
    "crates/oa-tfms",
    "crates/oa-display",
    "crates/oa-display-present",
    "crates/oa-scope-replay",
    "crates/oa-tiff",
    "crates/oa-dof",
    "crates/oa-grib2",
    "crates/oa-j2k",
    "crates/oa-mva",
    "crates/oa-awc",
    "crates/oa-iwxxm",
    "crates/oa-truth",
    "crates/oa-bench",
    "crates/oa-wind",
    "crates/oa-asterix",
    "crates/oa-nam",
    "crates/oa-sensorsim",
    "crates/oa-track",
    "crates/oa-track-tools",
    "crates/openatca-core",
    "crates/openatca-core-ffi",
    "crates/oa-encounter",
    "crates/oa-flight",
    "crates/oa-flight-sfdps",
    "crates/oa-migration-shadow",
    "crates/oa-safety",
    "crates/oa-ca",
    "crates/oa-msaw",
    "crates/oa-techops",
    "crates/oa-runway",
    "crates/oa-sealed",
    "crates/oa-time-window",
    "tools/oa-adapt",
    "tools/oa-build-info",
    "tools/oa-regional-session",
    "tools/oa-encounter",
    "tools/oa-legacy-traj",
    "tools/oa-msaw",
    "tools/oa-ca",
    "tools/oa-feed-gaps",
    "tools/oa-compass",
    "tools/oa-perf",
    "tools/oa-replay-diff",
    "tools/oa-stdds-ref",
    "tools/oa-shadow",
    "tools/oa-stdds-census",
    "tools/oa-trace",
    "tools/oa-sector-reconstruct",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
authors = ["Avila Labs"]

[workspace.lints.rust]
unsafe_code = "forbid"
# Kani proof harnesses are compiled only by `cargo kani` (docs/VERIFICATION.md).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(kani_full_capacity)', 'cfg(kani_late_replay_covers)', 'cfg(creusot)'] }

# RULESET E3: no panic paths outside tests. Test modules opt out with a module-level allow.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
debug = 1
# RULESET E3: overflow is checked in release builds too; it panics rather than wraps.
overflow-checks = true

[profile.dev]
# Tests and debug builds are optimised: the real-data suites are compute-bound and took most of
# each full test run unoptimised. Debug assertions and overflow checks stay on (dev defaults).
opt-level = 1
