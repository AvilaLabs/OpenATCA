[workspace]
resolver = "2"
members = [
    "crates/oa-csv",
    "crates/oa-geo",
    "crates/oa-nasr",
    "crates/oa-arinc424",
    "crates/oa-sha256",
    "crates/oa-zip",
    "crates/oa-airspace",
    "tools/oa-trace",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
authors = ["Avila Labs"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
