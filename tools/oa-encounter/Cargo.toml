[package]
name = "oa-encounter-run"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-adsb = { path = "../../crates/oa-adsb" }
oa-bench = { path = "../../crates/oa-bench" }
oa-encounter = { path = "../../crates/oa-encounter" }
oa-flight = { path = "../../crates/oa-flight" }
oa-flight-sfdps = { path = "../../crates/oa-flight-sfdps" }
oa-math = { path = "../../crates/oa-math" }
oa-nasr = { path = "../../crates/oa-nasr" }
oa-sealed = { path = "../../crates/oa-sealed" }
oa-sha256 = { path = "../../crates/oa-sha256" }
oa-track = { path = "../../crates/oa-track" }
# RULESET F1: private split-report evaluator API is isolated in the tool package.
oa-track-tools = { path = "../../crates/oa-track-tools" }
oa-zip = { path = "../../crates/oa-zip" }

[dev-dependencies]
# Workspace crate, not an outside dependency (RULESET F1): frames the recordings the join tests and the sealed-window test make.
oa-feed = { path = "../../crates/oa-feed" }

[lib]
name = "oa_encounter_run"
path = "src/lib.rs"

[[bin]]
name = "oa-encounter"
path = "src/main.rs"

[package.metadata.openatca]
class = "shell"
