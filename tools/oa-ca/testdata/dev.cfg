# Conflict alert configuration for the development hour (ZAU, 13 November 2026, 18:00Z).
#
# DEVELOPMENT VALUES, NOT ERAM/STARS VALUES. Nothing in this file is a value of any operational
# system, an adaptation of any facility or a number taken from FAA order 7110.65. The look-ahead,
# the minima and the hysteresis are chosen here to run the tool on the development clip; the
# budgets and capacities were set to about ten times what the busiest cycle of that clip needed in
# one run (not re-measured since).

look_ahead_s = 120
hysteresis_s = 10

# The volume of a pair outside every volume below: 5 NM horizontal ("en route") and 1,000 ft.
default_h_nm = 5
default_v_ft = 1000

# A terminal box around ORD: 3 NM horizontal and 1,000 ft, below 18,000 ft (the band is
# -2,000 to 17,999 ft, both ends included).
volume = box 41.4 42.4 -88.4 -87.4 -2000 17999 3 1000

max_tracks = 8192
max_open = 16384
max_candidates = 1048576
work_budget = 50000000
eval_budget = 500000
# A row faster than this is refused as bad; a track's 95 % radius is held to the cap.
max_speed_mps = 700
r95_cap_m = 20000
# Height of a band of the candidate grid.
grid_band_m = 20000

net_stale_limit_s = 10
net_future_horizon_s = 2
alert_log_capacity = 262144
event_log_capacity = 262144
