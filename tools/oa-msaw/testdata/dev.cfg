# Minimum safe altitude warning configuration for the development hour (ZAU, 13 November 2026,
# 18:00Z).
#
# DEVELOPMENT VALUES, NOT FAA VALUES. Nothing in this file is a value of any operational system,
# an adaptation of any facility or a number taken from FAA order 7110.65 or any FAA minimum
# altitude standard. The look-ahead, the warning time, the clearances and the hysteresis are chosen
# here to run the tool on the development clip; the capacities and the budget were set to well above
# what that clip needs.

look_ahead_s = 60
# A violation within 20 s is a warning, a later one a caution.
warning_s = 20
# A point of the predicted path every 5 s.
samples = 13
hysteresis_s = 10

# Clearance above the highest terrain and the highest obstacle top inside a point's radius. A2.08
# (FAA ARTS IIA, 1998) gives 500 ft above the highest terrain or obstacle for the alert altitude;
# these are development values, to be fitted only on development days.
gtm_clearance_ft = 500
obstacle_clearance_ft = 500

max_tracks = 8192
max_open = 4096
# Tracks evaluated per cycle; over it the lowest altitudes are evaluated first and the rest counted.
track_budget = 2048
# A row faster than this is refused as bad. The net reads degraded when more than this share of the airborne tracks of a cycle have a 95 % radius above 2 km.
max_speed_mps = 400
wide_degrade_share = 0.2

net_stale_limit_s = 10
net_future_horizon_s = 2
alert_log_capacity = 262144
skip_log_capacity = 262144

# The inhibition rules of the net: none lasts longer than an hour, starts more than an hour ahead
# or covers more than 2 degrees across. No inhibition is configured for this run.
inhibit_max_duration_s = 3600
inhibit_max_start_ahead_s = 3600
inhibit_max_extent_deg = 2

# Inside a final-approach corridor the surface is held this far below the published altitude at the
# final approach fix, terrain and obstacles get this clearance, and a point's radius grows with the
# prediction time by the velocity uncertainty.
# Development values, from the FAA ARTS IIA standards and guidelines to define and adapt MSAW site
# variables (A2.08, 1998), to be fitted only on development days: the approach capture box is 1 NM
# either side of the centreline (the lateral monitor distance) and the surface is held 100 ft
# below the published altitude (the minus 100 ft of ZMC and the MDA floor). In the runway strip and
# the last 1 NM of a capture box no clearance is added (an aircraft on a normal final is necessarily
# close to the ground): the floor is the higher of the surface less the allowance, terrain and the
# obstacle top, and a path that reaches the runway elevation over the runway is a landing.
approach_half_width_nm = 1.0
approach_allowance_ft = 100
approach_min_clearance_ft = 100
# Airport terminal areas replace A2.08's terrain inhibit areas around airports (practice, visual and
# circling approaches): within this radius of an airport with a CIFP approach, below this height
# above the airport, the general clearance is this one. Never an inhibit. Development values.
airport_area_nm = 5
airport_area_ceiling_ft_agl = 3000
airport_area_clearance_ft = 200
# Inside a departure corridor terrain and obstacles get this clearance and the chart does not apply.
departure_min_clearance_ft = 100
velocity_uncertainty_mps = 5
# A track whose latest barometric altitude is older than this is judged at an extrapolated altitude
# (a descent carried on, never a climb) and says so, until stale_hold_s; past it the track is not
# monitored, says so, and an open alert ends "lost: altitude stale". Development values: about 2 to 3
# terminal radar scans, and a hold of 30 s; to be fitted only on development days.
max_altitude_age_s = 12
stale_hold_s = 30
# The net reads degraded when more than this share of the airborne tracks of a cycle are not
# monitored for altitude (a decoder or a feed losing altitude wholesale). Development value.
altitude_loss_degrade_share = 0.5
# The prediction time inside an approach or departure corridor (FAA ARTS IIA A2.08 reduces the
# prediction time to 15 s in the capture boxes, a system parameter); elsewhere look_ahead_s,
# airport terminal areas included. Development value, to be fitted only on development days.
terminal_lookahead_s = 15

# A track below FL180 with no usable altimeter setting is lowered by this (the conservative
# direction) and counted; the setting is the nearest METAR station's within the radius and age.
# With none, the lowest setting of any station within 200 NM in the last 12 h is used (and the track
# stays flagged); only without even that, this allowance.
no_qnh_allowance_ft = 300
metar_radius_nm = 100
metar_max_age_s = 7200
