[package]
name = "oa-shadow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-adsb = { path = "../../crates/oa-adsb" }
oa-bench = { path = "../../crates/oa-bench" }
oa-math = { path = "../../crates/oa-math" }
oa-replay = { path = "../../crates/oa-replay" }
oa-sealed = { path = "../../crates/oa-sealed" }
oa-sha256 = { path = "../../crates/oa-sha256" }
oa-track = { path = "../../crates/oa-track" }
# RULESET F1: private split-report evaluator API is isolated in the tool package.
oa-track-tools = { path = "../../crates/oa-track-tools" }
oa-truth = { path = "../../crates/oa-truth" }

[dev-dependencies]
# Workspace crate, not an outside dependency (RULESET F1): frames the recordings the sealed-window test writes.
oa-feed = { path = "../../crates/oa-feed" }

[[bin]]
name = "oa-shadow"
path = "src/main.rs"

[package.metadata.openatca]
class = "shell"
