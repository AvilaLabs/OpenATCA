[package]
name = "oa-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-geo = { path = "../../crates/oa-geo" }
oa-math = { path = "../../crates/oa-math" }
oa-sealed = { path = "../../crates/oa-sealed" }
oa-sensorsim = { path = "../../crates/oa-sensorsim" }
oa-track = { path = "../../crates/oa-track" }
# RULESET F1: synthetic fusion benchmarks live in the private tool package.
oa-track-tools = { path = "../../crates/oa-track-tools" }
oa-truth = { path = "../../crates/oa-truth" }

[[bin]]
name = "oa-perf"
path = "src/main.rs"

[package.metadata.openatca]
class = "shell"
