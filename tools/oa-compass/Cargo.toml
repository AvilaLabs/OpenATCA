[package]
name = "oa-compass"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-adsb = { path = "../../crates/oa-adsb" }
oa-asterix = { path = "../../crates/oa-asterix" }
oa-bench = { path = "../../crates/oa-bench" }
oa-build-info = { path = "../oa-build-info" }
oa-ieee = { path = "../../crates/oa-ieee" }
oa-math = { path = "../../crates/oa-math" }
oa-sealed = { path = "../../crates/oa-sealed" }
oa-replay = { path = "../../crates/oa-replay" }
oa-truth = { path = "../../crates/oa-truth" }
oa-track = { path = "../../crates/oa-track" }
# RULESET F1: private split-report evaluator API is isolated in the tool package.
oa-track-tools = { path = "../../crates/oa-track-tools" }

[dev-dependencies]
# Workspace crate; parses the data-source file in the test (RULESET F1: not an outside dependency).
oa-json = { path = "../../crates/oa-json" }
# Writes the small ADS-B clip the job tests run on.
oa-feed = { path = "../../crates/oa-feed" }
# F1: generated CAT048 sensor plots for the radar-only command integration tests; never a runtime dependency.
oa-sensorsim = { path = "../../crates/oa-sensorsim" }

[package.metadata.openatca]
class = "split"
