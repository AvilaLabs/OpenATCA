[package]
name = "oa-regional-session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
default-run = "oa-regional-session"
autobins = false

[lints]
workspace = true

# F1: Connor explicitly approved the existing workspace runtime links below on 2026-11-24;
# they add no external packages. Each import site states the reason for its direct link.
[dependencies]
# Authoritative flight operations, stamped clearances and ownership transitions.
oa-flight = { path = "../../crates/oa-flight" }
# Actual observed traffic and deterministic issue-time tracker output.
oa-track = { path = "../../crates/oa-track" }
# Shared deterministic route trajectory calculation; existing study remains independent.
oa-legacy-traj = { path = "../oa-legacy-traj" }
# Actual short-term alerts remain based on observed traffic, independent of route intent.
oa-ca = { path = "../../crates/oa-ca" }
# Net availability, input degradation and inhibition state.
oa-safety = { path = "../../crates/oa-safety" }
# Plain scope inputs, ownership display and raster fingerprints.
oa-display = { path = "../../crates/oa-display" }
# Existing tracker-to-scope construction and deterministic rendering.
oa-scope-replay = { path = "../../crates/oa-scope-replay" }
# Adaptation snapshot and independent route conversion against its own NASR/CIFP model.
oa-airspace = { path = "../../crates/oa-airspace" }
# Exactly specified rounding before checked fixed-point conversions.
oa-ieee = { path = "../../crates/oa-ieee" }
# Bind inputs, adaptation, source, executable and output evidence to exact bytes.
oa-sha256 = { path = "../../crates/oa-sha256" }
# Check every input/output path and every source/receipt timestamp before admission.
oa-sealed = { path = "../../crates/oa-sealed" }
# F1: Connor explicitly approved these runtime links on 2026-11-24 (nine-link question).
# Execute the existing terrain-warning core on the same regional observation epoch.
oa-msaw = { path = "../../crates/oa-msaw" }
# Bounded terrain/obstacle/received-weather loading and datum correction, reused without a new parser.
oa-msaw-run = { path = "../oa-msaw" }
# F1: approved ninth internal runtime link (2026-11-24); the isolated A0 Linux
# presentation shell owns direct KMS/VT and evdev access for operated recorded replay.
oa-display-present = { path = "../../crates/oa-display-present" }
# F1 approval: Connor approved these existing workspace recording/decoder links on 2026-11-24.
# OAF bounded frame parsing and gzip inflation; import site: recordings_reader.rs.
oa-feed = { path = "../../crates/oa-feed" }
oa-zip = { path = "../../crates/oa-zip" }
# ADS-B binary payload and FIXM XML source decoder; import sites: recordings.rs.
oa-adsb = { path = "../../crates/oa-adsb" }
oa-fixm = { path = "../../crates/oa-fixm" }
oa-xml = { path = "../../crates/oa-xml" }
# Source-faithful SFDPS event→operation adapter; import site: recordings.rs.
oa-flight-sfdps = { path = "../../crates/oa-flight-sfdps" }
# F1: Connor approved this caller link on 2026-11-26; recorded source rows are classified before
# normalized events are committed, with bounded per-source manual-handling accounting.
oa-quarantine = { path = "../../crates/oa-quarantine" }
# F1: Connor approved this shell-only M4 projection edge on 2026-11-26. The regional shell is the
# existing boundary that receives flight and alert outputs; import site: migration_shadow.rs.
oa-migration-shadow = { path = "../../crates/oa-migration-shadow" }

[package.metadata.openatca]
class = "shell"

[[bin]]
name = "oa-regional-session"
path = "src/main.rs"

[[bin]]
name = "regional-recovery-worker"
path = "src/bin/regional-recovery-worker.rs"

[[bin]]
name = "regional-recording-import"
path = "src/bin/regional-recording-import.rs"

[[bin]]
name = "regional-m4-h2-full-day"
path = "src/bin/regional-m4-h2-full-day.rs"

[[bin]]
name = "oa-regional-console"
path = "src/bin/regional-console.rs"
