name: Rust assurance
on:
  push:
    branches: [main, 'train/**']
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      proof_ids:
        description: "Optional comma-separated enabled proof IDs for a focused diagnostic run"
        required: false
        type: string
      diagnose_regression:
        description: "Compare the two E-10 proof failures at the pinned baseline and source revisions"
        required: false
        type: boolean
        default: false
      compare_target_contexts:
        description: "Run the five pinned E-10 proofs sequentially with shared versus fresh target directories"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  kani:
    runs-on: ubuntu-24.04
    # A push or pull request runs every registered proof for packages reached by the change.
    # Scheduled/manual full runs cover the registry; workflow_dispatch can select exact IDs.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.compare_target_contexts == 'true' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.compare_target_contexts == 'true' && '[{"context_diagnostic":true,"context":"shared","source_ref":"82009cde336ab3f2cf5db3bd8897df90b2c2bdcb","shard":"0/1"},{"context_diagnostic":true,"context":"fresh","source_ref":"82009cde336ab3f2cf5db3bd8897df90b2c2bdcb","shard":"0/1"}]' || github.event_name == 'workflow_dispatch' && github.event.inputs.diagnose_regression == 'true' && '[{"diagnostic":true,"case":"baseline-late","source_ref":"8c5923da2f0c7f11ca84e99fc443980d86b4ef5c","proof_id":"late-append-output-projection","shard":"0/1"},{"diagnostic":true,"case":"current-late","source_ref":"64c44e714bc47bdeb956e671d7e15aa4f06edfde","proof_id":"late-append-output-projection","shard":"0/1"},{"diagnostic":true,"case":"baseline-snapshot","source_ref":"8c5923da2f0c7f11ca84e99fc443980d86b4ef5c","proof_id":"large-move-decision-rejected-current-filter-snapshot","shard":"0/1"},{"diagnostic":true,"case":"current-snapshot","source_ref":"64c44e714bc47bdeb956e671d7e15aa4f06edfde","proof_id":"large-move-decision-rejected-current-filter-snapshot","shard":"0/1"}]' || '[{"diagnostic":false,"context_diagnostic":false,"source_ref":"","proof_id":"","context":"","shard":"0/4"},{"diagnostic":false,"context_diagnostic":false,"source_ref":"","proof_id":"","context":"","shard":"1/4"},{"diagnostic":false,"context_diagnostic":false,"source_ref":"","proof_id":"","context":"","shard":"2/4"},{"diagnostic":false,"context_diagnostic":false,"source_ref":"","proof_id":"","context":"","shard":"3/4"}]') }}
    name: ${{ matrix.context_diagnostic && format('target context {0}', matrix.context) || matrix.diagnostic && matrix.case || format('shard {0}', matrix.shard) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse conflicting diagnostic modes
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.compare_target_contexts == 'true' && github.event.inputs.diagnose_regression == 'true' }}
        run: exit 2
      - name: Check out pinned proof source for diagnostic comparison
        if: ${{ matrix.diagnostic || matrix.context_diagnostic }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_ref }}
          path: source
          fetch-depth: 0
      - name: Install pinned product Rust compiler
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Install Kani installer compiler
        run: >-
          rustup toolchain install nightly-2026-08-21 --profile minimal
          --component llvm-tools --component rustc-dev --component rust-src --component rustfmt
      - name: Install pinned Kani verifier
        run: |
          cargo +nightly-2026-08-21 install --locked kani-verifier --version 0.68.0
          cargo +nightly-2026-08-21 kani setup
      - name: Verify proof tool versions
        run: |
          kani --version | grep -F '0.68.0'
          rustc +1.89.0 --version | grep -E '^rustc 1\.89\.0([[:space:]]|$)'
      - name: Validate proof suite registry
        run: python3 tools/test_rust_proof_suite.py
      - name: Test Kani runner and result bindings
        run: python3 tools/test_kani_validation.py
      - name: Test E-10 diagnostic registry binding
        run: python3 tools/test_e10_kani_diagnostic.py
      - name: Pick the proofs this run covers
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PROOF_IDS: ${{ github.event.inputs.proof_ids }}
        run: |
          # Pushes compare with the previous commit on main; PRs compare with their base.
          case "$EVENT" in
            push)
              base="$PUSH_BEFORE"
              if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base="$(git merge-base "$GITHUB_SHA" origin/main)"
              fi
              echo "changed_from=$base" >> "$GITHUB_OUTPUT"
              ;;
            pull_request) echo "changed_from=$PR_BASE" >> "$GITHUB_OUTPUT" ;;
            *) echo "changed_from=" >> "$GITHUB_OUTPUT" ;;
          esac
          if [[ "$PROOF_IDS" == *$'\n'* || "$PROOF_IDS" == *$'\r'* ]]; then
            echo "proof_ids input must be a single line" >&2
            exit 2
          fi
          printf 'proof_ids=%s\n' "$PROOF_IDS" >> "$GITHUB_OUTPUT"
      - name: Run registered proof suite sequentially
        env:
          CHANGED_FROM: ${{ steps.pick.outputs.changed_from }}
          PROOF_IDS: ${{ steps.pick.outputs.proof_ids }}
          DIAGNOSTIC: ${{ matrix.diagnostic }}
          CONTEXT_DIAGNOSTIC: ${{ matrix.context_diagnostic }}
          TARGET_CONTEXT: ${{ matrix.context }}
          SOURCE_REF: ${{ matrix.source_ref }}
          DIAGNOSTIC_PROOF_ID: ${{ matrix.proof_id }}
        shell: bash
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            python3 tools/e10_kani_diagnostic.py \
              --repo "$GITHUB_WORKSPACE/source" \
              --proof-id "$DIAGNOSTIC_PROOF_ID" \
              --source-revision "$SOURCE_REF" \
              --out "$RUNNER_TEMP/kani-proof-evidence/diagnostic"
            exit $?
          fi
          if [ "$CONTEXT_DIAGNOSTIC" = "true" ]; then
            python3 tools/e10_kani_diagnostic.py \
              --repo "$GITHUB_WORKSPACE/source" \
              --target-context "$TARGET_CONTEXT" \
              --source-revision "$SOURCE_REF" \
              --out "$RUNNER_TEMP/kani-proof-evidence/target-context"
            exit $?
          fi
          args=(--shard "${{ matrix.shard }}")
          if [ -n "$CHANGED_FROM" ]; then args+=(--changed-from "$CHANGED_FROM"); fi
          if [ -n "$PROOF_IDS" ]; then args+=(--proof-ids "$PROOF_IDS"); fi
          python3 tools/rust_proof_suite.py "${args[@]}" \
            --repo "$GITHUB_WORKSPACE" \
            --registry "$GITHUB_WORKSPACE/tools/rust_proofs.json" \
            --out "$RUNNER_TEMP/kani-proof-evidence" \
            --target-dir "$RUNNER_TEMP/kani-proof-target"
      - name: Upload proof JSON and invocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-proof-evidence-${{ strategy.job-index }}
          path: ${{ runner.temp }}/kani-proof-evidence/
          if-no-files-found: warn
          retention-days: 14
  miri:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (github.event.inputs.diagnose_regression == 'true' || github.event.inputs.compare_target_contexts == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned interpreter toolchain
        run: rustup toolchain install nightly-2026-08-21 --profile minimal --component miri,rust-src
      - name: Configure isolated build cache
        run: |
          printf 'MIRI_SYSROOT=%s/miri-sysroot\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          proof_checkout_key=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -d' ' -f1)
          printf 'CARGO_TARGET_DIR=%s/miri-checkouts/%s\n' "$RUNNER_TEMP" "$proof_checkout_key" >> "$GITHUB_ENV"
      - name: Record tool versions and prepare Miri sysroot
        run: |
          rustc +nightly-2026-08-21 --version
          cargo +nightly-2026-08-21 miri --version
          cargo +nightly-2026-08-21 miri setup
      - name: Run selected production regressions
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re, subprocess
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "miri-evidence"
          out.mkdir()
          cases = [
              ("oa-replay", "core::mono_split::tests::exercises_each_refusal_class_and_signed_boundary_successes"),
              ("oa-track-core", "tracker::tests::numerical_failure_after_partial_late_replay_rolls_back_track_stats_and_rows"),
              ("oa-track-core", "tracker::tests::invalid_anchor_refuses_late_rebuild_without_mutation_and_recovers"),
          ]
          for index, (package, case) in enumerate(cases):
              command = ["cargo", "+nightly-2026-08-21", "miri", "test", "--locked", "--offline",
                         "-p", package, "--lib", case, "--", "--exact"]
              result = subprocess.run(command, capture_output=True, text=True, timeout=600)
              (out / f"{index}.stdout.log").write_text(result.stdout)
              (out / f"{index}.stderr.log").write_text(result.stderr)
              print(result.stdout, end="")
              print(result.stderr, end="")
              if result.returncode or not re.search(r"^test result: ok\. 1 passed; 0 failed;", result.stdout, re.MULTILINE):
                  raise SystemExit(f"Selected Miri regression did not pass exactly once: {case}")
          PYTHON
      - name: Upload interpreter logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miri-evidence
          path: ${{ runner.temp }}/miri-evidence/
          if-no-files-found: warn
          retention-days: 14
