name: ci
on:
  push:
    branches: [main, 'train/**', 'wip/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt && rustup default 1.89.0
      - name: Format
        run: cargo +1.89.0 fmt --all --check
      - name: Lint
        run: cargo +1.89.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Candidate evaluator tests
        run: python3 tools/test_validate_candidate.py
      - name: Latency aggregate validation tests
        run: python3 tools/test_latency_validation.py
      - name: Validate checked-in latency aggregate
        run: python3 tools/check_latency_validation.py
      - name: Python wheel backend tests
        run: python3 -m unittest discover -s python/tests -v
      - name: Python release gate and wheel verification tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: J2 format specs and synthetic readers
        run: python3 -m unittest discover -s docs/core-api/formats -p test_format_specs.py
      - name: Reusable tracker package boundary tests
        run: python3 tools/test_tracker_package_boundary.py
      - name: Allocator evaluator tests
        run: python3 tools/test_allocator_validation.py
      - name: Proof control provisioning tests
        run: python3 tools/test_prepare_rust_proof_controls.py
      - name: Allocation harness
        run: python3 tools/check_allocations.py --target-dir "$RUNNER_TEMP/oa-allocator-target" --out "$RUNNER_TEMP/oa-allocator-evidence"
      - name: Attach allocation qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oa-allocator-evidence/
          if-no-files-found: warn
      - name: Feed reader work check (release)
        run: cargo +1.89.0 run --release --locked --manifest-path validation/oa-feed-work-check/Cargo.toml --target-dir "$RUNNER_TEMP/oa-feed-work-check-target"
      - name: Format standalone conformance-vector checker
        run: cargo +1.89.0 fmt --manifest-path validation/oa-vectors/Cargo.toml -- --check
      - name: Lint standalone conformance-vector checker
        run: timeout 10m cargo +1.89.0 clippy --offline --manifest-path validation/oa-vectors/Cargo.toml --all-targets --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked -- -D warnings
      - name: Test conformance-vector checker (offline)
        run: timeout 10m cargo +1.89.0 test --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Validate checked-in conformance vectors (offline)
        run: timeout 10m cargo +1.89.0 run --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Test
        run: cargo +1.89.0 test --workspace --release --locked
      - name: Actual WASM engine startup and native frame parity
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.89.0
          python3 tools/check_demo_wasm_parity.py --out "$RUNNER_TEMP/openatca-private/f2-wasm-parity"
      - name: Native C and Python FFI vectors (x86_64)
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/oa-core-ffi-target"
          artifact_json="$RUNNER_TEMP/oa-core-ffi-artifacts.jsonl"
          cargo +1.89.0 build -p openatca-core-ffi --locked \
            --message-format=json-render-diagnostics --target-dir "$target_dir" > "$artifact_json"
          ffi_lib="$(python3 - "$artifact_json" "$target_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          artifact_json, target_dir = map(Path, sys.argv[1:])
          target = target_dir.resolve(strict=True)
          libraries = []
          with artifact_json.open(encoding="utf-8") as stream:
              for line in stream:
                  record = json.loads(line)
                  target_info = record.get("target", {})
                  if record.get("reason") == "compiler-artifact" and target_info.get("name") == "openatca_core_ffi":
                      libraries.extend(Path(name) for name in record.get("filenames", []) if name.endswith(".so"))
          if len(libraries) != 1:
              raise SystemExit(f"expected exactly one Cargo-produced shared library, found {len(libraries)}")
          library = libraries[0]
          if library.is_symlink():
              raise SystemExit("Cargo shared library must not be a symlink")
          library = library.resolve(strict=True)
          library.relative_to(target)
          if not library.is_file():
              raise SystemExit("Cargo shared library is not a regular file")
          print(library)
          PY
          )"
          library_sha="$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
          echo "Cargo FFI library: $ffi_lib ($library_sha)"
          export PYTHONDONTWRITEBYTECODE=1
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-geodesy"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_l0_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-l0"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_text_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-text"
          "$RUNNER_TEMP/oa-ffi-geodesy" crates/openatca-core-ffi/tests/fixtures/wgs84.csv
          "$RUNNER_TEMP/oa-ffi-l0" crates/openatca-core-ffi/tests/fixtures/l0.csv \
            crates/openatca-core-ffi/tests/fixtures/polygon.csv
          "$RUNNER_TEMP/oa-ffi-text" crates/openatca-core-ffi/tests/fixtures/text-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_vectors.py "$ffi_lib"
          python3 crates/openatca-core-ffi/tests/test_ctypes_l0.py "$ffi_lib"
          python3 crates/openatca-core-ffi/tests/test_ctypes_text.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/text-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_polygon_thread_safety.py
          test "$library_sha" = "$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
      - name: Diagnostic example regressions
        run: |
          cargo +1.89.0 test --release --locked -p oa-track
          cargo +1.89.0 test --release --locked -p oa-track-tools --example turn_diag --example vs_eram --example p002
          cargo +1.89.0 test --release --locked -p oa-adsb --example surface_counts
      - name: Turn-onset scorer regressions
        run: python3 tools/test_turn_onset.py
      - name: Reproduction package regressions
        run: |
          python3 tools/test_repro_package_io.py
          python3 tools/test_reproduce_zau.py
      - name: Requirements and assurance traceability
        run: |
          python3 tools/test_f1a_dependency_graph.py
          python3 tools/check_f1a_dependency_graph.py
          cargo +1.89.0 run --locked -p oa-trace
          python3 -m unittest discover -s tools/oa-encounter/tests -p 'test_*.py'
          python3 tools/test_generate_oscal_control_map.py
          python3 tools/generate_oscal_control_map.py --check
          python3 tools/test_generate_safety_tables.py
          python3 tools/generate_safety_tables.py
      - name: Attach generated safety tables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safety-tables
          path: docs/safety/generated/
          if-no-files-found: error
          retention-days: 90
      - name: No external dependencies
        run: |
          if grep -q 'source = ' Cargo.lock; then echo "external dependency found in Cargo.lock"; exit 1; fi
      - name: Generate SPDX SBOM and toolchain provenance
        if: always()
        run: |
          set -euo pipefail
          python3 .github/scripts/supply_chain_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/supply-chain-evidence" \
            --toolchain 1.89.0
          cp .github/security/ssdf-evidence-map.json \
            "$RUNNER_TEMP/supply-chain-evidence/ssdf-evidence-map.json"
      - name: Attach supply-chain evidence to this CI run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openatca-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supply-chain-evidence/
          if-no-files-found: warn
          retention-days: 90
  # REQUIREMENTS.md promises results are the same bits on every IEEE-754 machine (oa-math). The
  # golden-digest tests run here on a second architecture (aarch64) to prove it.
  arm:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Test conformance-vector checker (offline, aarch64)
        run: timeout 10m cargo +1.89.0 test --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Validate checked-in conformance vectors (offline, aarch64)
        run: timeout 10m cargo +1.89.0 run --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Test (release, aarch64)
        run: cargo +1.89.0 test --workspace --release --locked
      - name: Native C and Python FFI vectors (aarch64)
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/oa-core-ffi-target"
          artifact_json="$RUNNER_TEMP/oa-core-ffi-artifacts.jsonl"
          cargo +1.89.0 build -p openatca-core-ffi --locked \
            --message-format=json-render-diagnostics --target-dir "$target_dir" > "$artifact_json"
          ffi_lib="$(python3 - "$artifact_json" "$target_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          artifact_json, target_dir = map(Path, sys.argv[1:])
          target = target_dir.resolve(strict=True)
          libraries = []
          with artifact_json.open(encoding="utf-8") as stream:
              for line in stream:
                  record = json.loads(line)
                  target_info = record.get("target", {})
                  if record.get("reason") == "compiler-artifact" and target_info.get("name") == "openatca_core_ffi":
                      libraries.extend(Path(name) for name in record.get("filenames", []) if name.endswith(".so"))
          if len(libraries) != 1:
              raise SystemExit(f"expected exactly one Cargo-produced shared library, found {len(libraries)}")
          library = libraries[0]
          if library.is_symlink():
              raise SystemExit("Cargo shared library must not be a symlink")
          library = library.resolve(strict=True)
          library.relative_to(target)
          if not library.is_file():
              raise SystemExit("Cargo shared library is not a regular file")
          print(library)
          PY
          )"
          library_sha="$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
          echo "Cargo FFI library: $ffi_lib ($library_sha)"
          export PYTHONDONTWRITEBYTECODE=1
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-geodesy"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_l0_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-l0"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_text_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-text"
          "$RUNNER_TEMP/oa-ffi-geodesy" crates/openatca-core-ffi/tests/fixtures/wgs84.csv
          "$RUNNER_TEMP/oa-ffi-l0" crates/openatca-core-ffi/tests/fixtures/l0.csv \
            crates/openatca-core-ffi/tests/fixtures/polygon.csv
          "$RUNNER_TEMP/oa-ffi-text" crates/openatca-core-ffi/tests/fixtures/text-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_vectors.py "$ffi_lib"
          python3 crates/openatca-core-ffi/tests/test_ctypes_l0.py "$ffi_lib"
          python3 crates/openatca-core-ffi/tests/test_ctypes_text.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/text-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_polygon_thread_safety.py
          test "$library_sha" = "$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
  # The dev profile (opt-level 1, debug assertions and overflow checks on). The debug_assert! checks
  # never run in the release-only test job above.
  debug-assertions:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Test (dev profile)
        run: cargo +1.89.0 test --workspace --locked
  # Short coverage-guided run of every fuzz target (docs/FUZZING.md). fuzz/ is its own workspace
  # with its own Cargo.lock; the root workspace never builds it. The corpus is the committed
  # synthetic seeds (the real-data corpora from make_corpora.py are not redistributable).
  fuzz-smoke:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install nightly-2026-08-21 --profile minimal --component rust-src && rustup default nightly-2026-08-21
      - name: Cache fuzz dependencies and build outputs
        id: fuzz-cache
        # actions/cache v6.1.0, pinned to its verified upstream commit.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-nightly-2026-08-21-${{ hashFiles('fuzz/Cargo.lock') }}-fuzz-smoke-${{ matrix.shard }}-${{ runner.arch }}
      - name: Record cache state and shard budget
        env:
          FUZZ_CACHE_HIT: ${{ steps.fuzz-cache.outputs.cache-hit }}
          FUZZ_SHARD: ${{ matrix.shard }}
        run: |
          printf 'cache_hit=%s\nshard=%s\ntarget_seconds=60\n' "$FUZZ_CACHE_HIT" "$FUZZ_SHARD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove stale cached example executables
        run: |
          rm -rf fuzz/target/debug/examples fuzz/target/release/examples
          find fuzz/target -mindepth 3 -maxdepth 4 -type d \( -path '*/debug/examples' -o -path '*/release/examples' \) -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-08-21 install --locked cargo-fuzz --version 0.13.2
      - name: Enumerate and verify fuzz targets
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-21 fuzz list > "$RUNNER_TEMP/fuzz-targets.txt"
      - name: Fuzz assigned targets for 60 seconds each
        run: python3 .github/scripts/run_fuzz_shard.py --targets-file "$RUNNER_TEMP/fuzz-targets.txt" --shard "${{ matrix.shard }}"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-shard-${{ matrix.shard }}
          path: fuzz/artifacts/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
