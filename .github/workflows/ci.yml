name: ci
on:
  push:
    branches: [main, 'train/**', 'wip/**']
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  commit-hygiene:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/wip/') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Mask commit identity before validation
        id: email-mask
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_commit_hygiene.py --mask-preflight
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Check commit metadata and tracked path hygiene
        if: steps.email-mask.outputs.ready == 'true'
        env:
          EXPECTED_COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 .github/scripts/test_commit_hygiene.py
          python3 .github/scripts/check_commit_hygiene.py
  quality-negative-proof:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/train/quality-proof-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        escape: [E01, E02, E03]
    steps:
      - uses: actions/checkout@v4
      - name: Prove the class checker refuses the isolated defect
        env:
          PROOF_CLASS: ${{ matrix.escape }}
        run: |
          set -euo pipefail
          python3 .github/scripts/test_commit_hygiene.py --proof-class "$PROOF_CLASS" \
            | tee "$RUNNER_TEMP/quality-proof-$PROOF_CLASS.txt"
      - name: Attach safe checker refusal receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-refusal-${{ matrix.escape }}
          path: ${{ runner.temp }}/quality-proof-${{ matrix.escape }}.txt
          if-no-files-found: error
  safety-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure isolated synthetic data root
        run: python3 .github/scripts/configure_test_data_root.py
      - name: Test synthetic data root setup
        run: python3 .github/scripts/test_configure_test_data_root.py
      - name: Install product Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Install pinned mutation runner
        run: cargo +1.89.0 install --locked cargo-mutants --version 27.1.0
      - name: Verify mutation runner
        run: cargo mutants --version | grep -Fx 'cargo-mutants 27.1.0'
      - name: Mutation checker tests
        run: python3 tools/test_check_safety_mutations.py
      - name: Synthetic mutation runner fixture
        run: python3 tools/run_safety_mutants_fixture.py
      - name: Select changed range
        id: changed-range
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [[ "$EVENT" == push ]]; then
            head="$HEAD_SHA"
            if [[ "$PUSH_REF" != refs/heads/main || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              base="$(git merge-base "$head" origin/main)"
            else
              base="$PUSH_BEFORE"
            fi
          else
            echo 'unsupported workflow event' >&2
            exit 1
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"
      - name: Check changed safety-source mutants
        env:
          MUTATION_BASE: ${{ steps.changed-range.outputs.base }}
          MUTATION_HEAD: ${{ steps.changed-range.outputs.head }}
        run: python3 tools/check_safety_mutations.py --base "$MUTATION_BASE" --head "$MUTATION_HEAD"
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure isolated synthetic data root
        run: python3 .github/scripts/configure_test_data_root.py
      - name: Toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt && rustup default 1.89.0
      - name: Cache Rust dependencies and build outputs
        id: rust-cache
        # actions/cache v6.1.0, pinned to its verified upstream commit.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-1.89.0-clippy-rustfmt-${{ hashFiles('Cargo.lock', 'validation/oa-vectors/Cargo.lock') }}-${{ github.job }}-${{ runner.arch }}
      - name: Record cache state
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf 'cache_hit=%s\n' "$RUST_CACHE_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove stale cached example executables
        run: rm -rf target/debug/examples target/release/examples
      - name: Format
        run: cargo +1.89.0 fmt --all --check
      - name: Lint
        run: cargo +1.89.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Candidate evaluator tests
        run: python3 tools/test_validate_candidate.py
      - name: Latency aggregate validation tests
        run: python3 tools/test_latency_validation.py
      - name: Validate checked-in latency aggregate
        run: python3 tools/check_latency_validation.py
      - name: Python wheel backend tests
        run: python3 -m unittest discover -s python/tests -v
      - name: Python release gate and wheel verification tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: J2 format specs and synthetic readers
        run: python3 -m unittest discover -s docs/core-api/formats -p test_format_specs.py
      - name: Reusable tracker package boundary tests
        run: python3 tools/test_tracker_package_boundary.py
      - name: Allocator evaluator tests
        run: python3 tools/test_allocator_validation.py
      - name: Proof control provisioning tests
        run: python3 tools/test_prepare_rust_proof_controls.py
      - name: Select immutable quality baseline revision
        id: quality-range
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [[ "$EVENT" == push ]]; then
            head="$HEAD_SHA"
            if [[ "$PUSH_REF" != refs/heads/main || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              base="$(git merge-base "$head" origin/main)"
            else
              base="$PUSH_BEFORE"
            fi
          else
            echo 'unsupported workflow event' >&2
            exit 1
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"
      - name: Check safety flag consumers
        run: |
          python3 .github/scripts/test_safety_flag_consumers.py
          python3 .github/scripts/check_safety_flag_consumers.py
      - name: Test quality size ratchet
        run: PYTHONPATH=. python3 tools/test_quality_size_ratchet.py
      - name: Prepare prior-revision quality baseline
        env:
          BASE_REVISION: ${{ steps.quality-range.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p target
          worktree="$RUNNER_TEMP/quality-baseline-worktree"
          test ! -e "$worktree"
          git worktree add --detach "$worktree" "$BASE_REVISION"
          mkdir -p "$worktree/target"
          python3 "$GITHUB_WORKSPACE/tools/quality_size_ratchet.py" \
            --root "$worktree" \
            --baseline "$worktree/target/quality-prior-baseline.json" \
            --write-baseline
          cp "$worktree/target/quality-prior-baseline.json" target/quality-prior-baseline.json
          git worktree remove --force "$worktree"
      - name: Check quality size against prior revision
        run: python3 tools/quality_size_ratchet.py --root "$GITHUB_WORKSPACE" --baseline target/quality-prior-baseline.json --check
      - name: Allocation harness
        run: python3 tools/check_allocations.py --target-dir "$RUNNER_TEMP/oa-allocator-target" --out "$RUNNER_TEMP/oa-allocator-evidence"
      - name: Attach allocation qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oa-allocator-evidence/
          if-no-files-found: warn
      - name: Feed reader work check (release)
        run: cargo +1.89.0 run --release --locked --manifest-path validation/oa-feed-work-check/Cargo.toml --target-dir "$RUNNER_TEMP/oa-feed-work-check-target"
      - name: Format standalone conformance-vector checker
        run: cargo +1.89.0 fmt --manifest-path validation/oa-vectors/Cargo.toml -- --check
      - name: Lint standalone conformance-vector checker
        run: timeout 10m cargo +1.89.0 clippy --offline --manifest-path validation/oa-vectors/Cargo.toml --all-targets --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked -- -D warnings
      - name: Test conformance-vector checker (offline)
        run: timeout 10m cargo +1.89.0 test --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Validate checked-in conformance vectors (offline)
        run: timeout 10m cargo +1.89.0 run --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Test
        run: cargo +1.89.0 test --workspace --release --locked
      - name: Build release candidate binaries for VDD digests
        run: cargo +1.89.0 build --workspace --release --locked --bins
      - name: Actual WASM engine startup and native frame parity
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.89.0
          python3 tools/check_demo_wasm_parity.py --out "$RUNNER_TEMP/openatca-private/f2-wasm-parity"
      - name: Native C and Python FFI vectors (x86_64)
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/oa-core-ffi-target"
          artifact_json="$RUNNER_TEMP/oa-core-ffi-artifacts.jsonl"
          cargo +1.89.0 build -p openatca-core-ffi --locked \
            --message-format=json-render-diagnostics --target-dir "$target_dir" > "$artifact_json"
          ffi_lib="$(python3 - "$artifact_json" "$target_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          artifact_json, target_dir = map(Path, sys.argv[1:])
          target = target_dir.resolve(strict=True)
          libraries = []
          with artifact_json.open(encoding="utf-8") as stream:
              for line in stream:
                  record = json.loads(line)
                  target_info = record.get("target", {})
                  if record.get("reason") == "compiler-artifact" and target_info.get("name") == "openatca_core_ffi":
                      libraries.extend(Path(name) for name in record.get("filenames", []) if name.endswith(".so"))
          if len(libraries) != 1:
              raise SystemExit(f"expected exactly one Cargo-produced shared library, found {len(libraries)}")
          library = libraries[0]
          if library.is_symlink():
              raise SystemExit("Cargo shared library must not be a symlink")
          library = library.resolve(strict=True)
          library.relative_to(target)
          if not library.is_file():
              raise SystemExit("Cargo shared library is not a regular file")
          print(library)
          PY
          )"
          library_sha="$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
          echo "Cargo FFI library: $ffi_lib ($library_sha)"
          export PYTHONDONTWRITEBYTECODE=1
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-geodesy"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_l0_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-l0"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_text_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-text"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_deflate_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-deflate"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_deflate_encode_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-deflate-encode"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_tar_metadata_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-tar-metadata"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_asterix_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-asterix"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_zip_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-zip"
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_grib2_vectors.c "$ffi_lib" \
            "-Wl,-rpath,$(dirname "$ffi_lib")" -lm -o "$RUNNER_TEMP/oa-ffi-grib2"
          "$RUNNER_TEMP/oa-ffi-geodesy" crates/openatca-core-ffi/tests/fixtures/wgs84.csv
          "$RUNNER_TEMP/oa-ffi-l0" crates/openatca-core-ffi/tests/fixtures/l0.csv \
            crates/openatca-core-ffi/tests/fixtures/polygon.csv
          "$RUNNER_TEMP/oa-ffi-text" crates/openatca-core-ffi/tests/fixtures/text-v1.tsv
          "$RUNNER_TEMP/oa-ffi-deflate" crates/openatca-core-ffi/tests/fixtures/raw-deflate-v1.tsv
          "$RUNNER_TEMP/oa-ffi-deflate-encode" \
            crates/openatca-core-ffi/tests/fixtures/raw-deflate-encode-v1.tsv
          "$RUNNER_TEMP/oa-ffi-tar-metadata" \
            crates/openatca-core-ffi/tests/fixtures/tar-metadata-v1.tsv
          "$RUNNER_TEMP/oa-ffi-asterix" crates/openatca-core-ffi/tests/fixtures/asterix-v1.tsv
          "$RUNNER_TEMP/oa-ffi-zip" crates/openatca-core-ffi/tests/fixtures/zip-v1.tsv
          "$RUNNER_TEMP/oa-ffi-grib2" crates/openatca-core-ffi/tests/fixtures/grib2-bitmap-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_vectors.py "$ffi_lib"
          python3 crates/openatca-core-ffi/tests/test_ctypes_l0.py "$ffi_lib"
          python3 crates/openatca-core-ffi/tests/test_ctypes_text.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/text-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_deflate.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/raw-deflate-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_deflate_encode.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/raw-deflate-encode-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_tar_metadata.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/tar-metadata-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_asterix.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/asterix-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_zip.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/zip-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_ctypes_grib2.py "$ffi_lib" \
            crates/openatca-core-ffi/tests/fixtures/grib2-bitmap-v1.tsv
          python3 crates/openatca-core-ffi/tests/test_polygon_thread_safety.py
          test "$library_sha" = "$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
      - name: Diagnostic example regressions
        run: |
          cargo +1.89.0 test --release --locked -p oa-track
          cargo +1.89.0 test --release --locked -p oa-track-tools --example turn_diag --example vs_eram --example p002
          cargo +1.89.0 test --release --locked -p oa-adsb --example surface_counts
      - name: Turn-onset scorer regressions
        run: python3 tools/test_turn_onset.py
      - name: Reproduction package regressions
        run: |
          python3 tools/test_repro_package_io.py
          python3 tools/test_reproduce_zau.py
      - name: Requirements and assurance traceability
        run: |
          set -euo pipefail
          python3 tools/test_generate_vdd.py
          python3 tools/test_f1a_dependency_graph.py
          python3 tools/check_f1a_dependency_graph.py
          cargo +1.89.0 run --locked -p oa-trace -- --root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/oa-trace-vdd.txt"
          OPENATCA_OA_TRACE_BIN="$GITHUB_WORKSPACE/target/debug/oa-trace" \
            python3 tools/test_check_done_claim.py
          OPENATCA_OA_TRACE_BIN="$GITHUB_WORKSPACE/target/debug/oa-trace" \
            python3 -m unittest tools.test_prove_quality_rejections
          python3 -m unittest discover -s tools/oa-encounter/tests -p 'test_*.py'
          python3 tools/test_generate_oscal_control_map.py
          python3 tools/generate_oscal_control_map.py --check
          python3 tools/test_generate_safety_tables.py
          python3 tools/generate_safety_tables.py
      - name: Attach generated safety tables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safety-tables
          path: docs/safety/generated/
          if-no-files-found: error
          retention-days: 90
      - name: No external dependencies
        run: |
          if grep -q 'source = ' Cargo.lock; then echo "external dependency found in Cargo.lock"; exit 1; fi
      - name: Generate SPDX SBOM and toolchain provenance
        if: always()
        run: |
          set -euo pipefail
          python3 .github/scripts/supply_chain_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/supply-chain-evidence" \
            --toolchain 1.89.0
          cp .github/security/ssdf-evidence-map.json \
            "$RUNNER_TEMP/supply-chain-evidence/ssdf-evidence-map.json"
          cp "$RUNNER_TEMP/oa-trace-vdd.txt" \
            "$RUNNER_TEMP/supply-chain-evidence/requirements-trace.txt"
      - name: Generate candidate version description
        if: always()
        run: |
          python3 tools/generate_vdd.py \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/supply-chain-evidence/VERSION_DESCRIPTION.md" \
            --mode candidate \
            --trace-file "$RUNNER_TEMP/oa-trace-vdd.txt" \
            --build-dir target/release \
            --provenance-file "$RUNNER_TEMP/supply-chain-evidence/toolchain-provenance.json"
      - name: Attach supply-chain evidence to this CI run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openatca-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supply-chain-evidence/
          if-no-files-found: warn
          retention-days: 90
  # REQUIREMENTS.md promises results are the same bits on every IEEE-754 machine (oa-math). The
  # golden-digest tests run here on a second architecture (aarch64) to prove it.
  arm:
    if: ${{ !startsWith(github.ref, 'refs/heads/wip/') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated synthetic data root
        run: python3 .github/scripts/configure_test_data_root.py
      - name: Toolchain
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Cache Rust dependencies and build outputs
        id: rust-cache
        # actions/cache v6.1.0, pinned to its verified upstream commit.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock', 'validation/oa-vectors/Cargo.lock') }}-${{ github.job }}-${{ runner.arch }}
      - name: Record cache state
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf 'cache_hit=%s\n' "$RUST_CACHE_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove stale cached example executables
        run: rm -rf target/debug/examples target/release/examples target/aarch64-unknown-linux-gnu/debug/examples target/aarch64-unknown-linux-gnu/release/examples
      - name: Test conformance-vector checker (offline, aarch64)
        run: timeout 10m cargo +1.89.0 test --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Validate checked-in conformance vectors (offline, aarch64)
        run: timeout 10m cargo +1.89.0 run --offline --manifest-path validation/oa-vectors/Cargo.toml --target-dir "$RUNNER_TEMP/oa-vectors-target" --locked
      - name: Test (release, aarch64)
        run: cargo +1.89.0 test --workspace --release --locked
      - name: Native C and Python FFI vectors (aarch64)
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/oa-core-ffi-target"
          artifact_json="$RUNNER_TEMP/oa-core-ffi-artifacts.jsonl"
          cargo +1.89.0 build -p openatca-core-ffi --locked \
            --message-format=json-render-diagnostics --target-dir "$target_dir" > "$artifact_json"
          ffi_lib="$(python3 - "$artifact_json" "$target_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          artifact_json, target_dir = map(Path, sys.argv[1:])
          target = target_dir.resolve(strict=True)
          libraries = []
          with artifact_json.open(encoding="utf-8") as stream:
              for line in stream:
                  record = json.loads(line)
                  target_info = record.get("target", {})
                  if record.get("reason") == "compiler-artifact" and target_info.get("name") == "openatca_core_ffi":
                      libraries.extend(Path(name) for name in record.get("filenames", []) if name.endswith(".so"))
          if len(libraries) != 1:
              raise SystemExit(f"expected exactly one Cargo-produced shared library, found {len(libraries)}")
          library = libraries[0]
          if library.is_symlink():
              raise SystemExit("Cargo shared library must not be a symlink")
          library = library.resolve(strict=True)
          library.relative_to(target)
          if not library.is_file():
              raise SystemExit("Cargo shared library is not a regular file")
          print(library)
          PY
          )"
          library_sha="$(sha256sum "$ffi_lib" | cut -d' ' -f1)"
          echo "Cargo FFI library: $ffi_lib ($library_sha)"
          export PYTHONDONTWRITEBYTECODE=1
          cc -std=c11 -Wall -Wextra -Werror -I include \
            crates/openatca-core-ffi/tests/ffi_vectors.c "$ffi_lib" \
