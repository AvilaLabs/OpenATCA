# cargo-mutants configuration (https://mutants.rs).
#
# Kani proof harnesses live in `#[cfg(kani)] mod proofs` blocks (docs/VERIFICATION.md). `cargo test`
# never compiles them, so a mutant in one can only be reported as missed. Mutant names include the
# module path, so this skips every function in a module called `proofs`, and the two files that
# hold one.
# The coordinate-bound expressions below are individually reviewed equivalent return values.
# The early finite-input guards stay in product code.
exclude_re = [
  '\bproofs::',
  '^crates/oa-runway/src/plane\.rs:161:(30|56): replace \|\| with && in true_velocity_to_local$',
  '^crates/oa-runway/src/plane\.rs:171:(34|55): replace && with \|\| in true_velocity_to_local$',
  '^crates/oa-runway/src/plane\.rs:171:(49|71): replace > with >= in true_velocity_to_local$',
  '^crates/oa-runway/src/final_monitor\.rs:267:44: replace < with <= in prepare_pair$',
  '^crates/oa-display/src/core/alert_markers\.rs:301:30: replace > with >= in maximum_header_stats$',
  '^crates/oa-display/src/core/alert_markers\.rs:315:30: replace > with >= in maximum_header_stats$',
]
exclude_globs = ['**/proofs.rs', '**/proofs_wire.rs']
