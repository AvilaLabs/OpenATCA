[build-system]
requires = []
build-backend = "openatca_build"
backend-path = ["."]

[project]
name = "openatca"
version = "0.1.0"
description = "Provisional ctypes binding for selected L0 math, SHA-256, and WGS-84 geodesy operations"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Avila Labs" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: 10",
  "Programming Language :: Python :: 3 :: 11",
  "Programming Language :: Python :: 3 :: 12",
  "Programming Language :: Python :: 3 :: 13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AvilaLabs/OpenATCA"
Documentation = "https://github.com/AvilaLabs/OpenATCA/tree/main/python"
