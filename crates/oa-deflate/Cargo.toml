[package]
name = "oa-deflate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "RFC 1951 DEFLATE and RFC 1952 gzip writer"
documentation = "https://github.com/AvilaLabs/OpenATCA/blob/main/docs/core-api/foundations/containers.md"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# F1: path dependency inside this workspace, for CRC-32 (gzip trailer) and, in tests, the inflater.
oa-zip = { path = "../oa-zip" }

[dev-dependencies]
# Workspace crate, not an outside dependency (RULESET F1): the sealed hold-out guard, so the tests read their inputs through it.
oa-sealed = { path = "../oa-sealed" }

[package.metadata.openatca]
class = "shell"
candidate_package_name = "openatca-deflate"
release_profile = "0.1-candidate"
api_tier = "preview"
api_document = "docs/core-api/foundations/containers.md"
