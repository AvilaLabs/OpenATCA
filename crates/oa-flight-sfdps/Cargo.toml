[package]
name = "oa-flight-sfdps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates only; none is an outside dependency (RULESET F1).
oa-feed = { path = "../oa-feed" }
oa-fixm = { path = "../oa-fixm" }
oa-flight = { path = "../oa-flight" }
# RULESET F1: Connor Avila approved this workspace link on 2026-11-26 for bounded, offline
# conversion of validated SFDPS source facts into the existing M4 normalized-record schema.
# The adapter does not run the comparator or provide a legacy reference.
oa-migration-shadow = { path = "../oa-migration-shadow" }
oa-replay = { path = "../oa-replay" }
oa-sealed = { path = "../oa-sealed" }
oa-xml = { path = "../oa-xml" }

[dev-dependencies]
oa-time-window = { path = "../oa-time-window" }

[lib]
name = "oa_flight_sfdps"
path = "src/lib.rs"

[[bin]]
name = "oa-flight"
path = "src/main.rs"

[package.metadata.openatca]
class = "shell"
