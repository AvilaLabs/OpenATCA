[package]
name = "oa-track"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-adsb = { path = "../oa-adsb" }
oa-bench = { path = "../oa-bench" }
oa-feed = { path = "../oa-feed" }
oa-geo = { path = "../oa-geo" }
oa-math = { path = "../oa-math" }
oa-sealed = { path = "../../tools/oa-sealed" }
oa-sensorsim = { path = "../oa-sensorsim" }
oa-sha256 = { path = "../oa-sha256" }
oa-truth = { path = "../oa-truth" }

[features]
# Diagnostic only: records every applied measurement and its velocity gate decision
# (`gate_trace`), for the velocity_diag example. Off in every build that ships.
gate-trace = []

[[bin]]
name = "oa-track-run"
path = "src/main.rs"

[[bin]]
name = "oa-track-fusion"
path = "src/fusion_main.rs"

[dev-dependencies]
# Workspace crate, examples only.
oa-replay = { path = "../oa-replay" }

[package.metadata.openatca]
class = "unsplit"
