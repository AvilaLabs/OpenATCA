[package]
name = "oa-track"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-adsb = { path = "../oa-adsb" }
# Pure category and jump-rule model; the shell decoder remains in oa-adsb.
oa-adsb-model = { path = "../oa-adsb-model" }
oa-track-core = { path = "../oa-track-core" }
oa-geo = { path = "../oa-geo" }
oa-math = { path = "../oa-math" }
oa-sha256 = { path = "../oa-sha256" }
oa-truth = { path = "../oa-truth" }

[dev-dependencies]
# Simulator-only fixtures used by unit tests in the core engine; never a runtime library dependency.
# RULESET F1: test-only tool dependency, not linked into published consumers.
oa-sensorsim = { path = "../oa-sensorsim" }

[package.metadata.openatca]
class = "unsplit"
