[package]
name = "oa-asterix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ASTERIX CAT021, CAT048 and CAT062 profile codecs"
documentation = "https://github.com/AvilaLabs/OpenATCA/blob/main/docs/core-api/formats/asterix.md"
readme = "README.md"

[lints]
workspace = true

[dev-dependencies]
# Workspace crate, not an outside dependency (RULESET F1): the sealed hold-out guard, so the tests read their inputs through it.
oa-sealed = { path = "../oa-sealed" }
# Workspace crate only, not an outside dependency (RULESET F1): the test that builds a
# CAT021 record from a real oa-adsb row.
oa-adsb = { path = "../oa-adsb" }
# Also workspace only: reads the upstream decoder's JSON expected output in the capture tests.
oa-json = { path = "../oa-json" }

[package.metadata.openatca]
class = "shell"
candidate_package_name = "openatca-asterix"
release_profile = "0.1-candidate"
api_tier = "preview"
api_document = "docs/core-api/formats/asterix.md"
