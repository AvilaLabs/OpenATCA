[package]
name = "oa-fixm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "FIXM 3.0 and FAA NAS 3.0 SFDPS profile decoder"
documentation = "https://github.com/AvilaLabs/OpenATCA/blob/main/docs/core-api/formats/fixm-sfdps.md"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# The pure half-open window value passed to the decoder.
oa-time-window = { path = "../oa-time-window" }
oa-xml = { path = "../oa-xml" }

[dev-dependencies]
# Tests, examples and real-data fixtures exercise the private hold-out guard.
oa-sealed = { path = "../oa-sealed" }

[package.metadata.openatca]
class = "shell"
candidate_package_name = "openatca-fixm"
release_profile = "0.1-candidate"
api_tier = "preview"
api_document = "docs/core-api/formats/fixm-sfdps.md"
