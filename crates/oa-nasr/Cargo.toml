[package]
name = "oa-nasr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Typed parsers for the FAA NASR CSV subscription files"
documentation = "https://github.com/AvilaLabs/OpenATCA/blob/main/docs/core-api/formats/nasr.md"
