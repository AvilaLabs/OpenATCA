[package]
name = "oa-wind"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates; not outside dependencies (RULESET F1).
oa-grib2 = { path = "../oa-grib2" }
oa-awc = { path = "../oa-awc" }
oa-adsb = { path = "../oa-adsb" }

[dev-dependencies]
oa-grib2 = { path = "../oa-grib2", features = ["testenc"] }

[[bin]]
name = "oa-wind-check"
path = "src/main.rs"

[package.metadata.openatca]
class = "split"
