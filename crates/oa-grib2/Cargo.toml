[package]
name = "oa-grib2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "GRIB Edition 2 decoder for documented wind-grid templates"
documentation = "https://github.com/AvilaLabs/OpenATCA/blob/main/docs/core-api/formats/grib2-winds.md"
readme = "README.md"

[lints]
workspace = true

[features]
# Exposes the test-only encoder to the dev-dependencies of other crates.
testenc = []

[dependencies]
oa-j2k = { path = "../oa-j2k" }
oa-math = { path = "../oa-math" }

[dev-dependencies]
# Workspace crate, not an outside dependency (RULESET F1): the sealed hold-out guard, so the tests read their inputs through it.
oa-sealed = { path = "../oa-sealed" }

[package.metadata.openatca]
class = "shell"
candidate_package_name = "openatca-grib2"
release_profile = "0.1-candidate"
api_tier = "preview"
api_document = "docs/core-api/formats/grib2-winds.md"
