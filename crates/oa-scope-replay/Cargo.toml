[package]
name = "oa-scope-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

# Workspace crates only (RULESET F1). The tracker is linked here, in the shell, and never into the
# display crate (F6, D3).
[dependencies]
oa-sealed = { path = "../oa-sealed" }
oa-display = { path = "../oa-display" }
oa-track = { path = "../oa-track" }
oa-adsb = { path = "../oa-adsb" }
oa-feed = { path = "../oa-feed" }
oa-geo = { path = "../oa-geo" }
oa-math = { path = "../oa-math" }
oa-ieee = { path = "../oa-ieee" }
oa-sha256 = { path = "../oa-sha256" }
oa-airspace = { path = "../oa-airspace" }

# Test only: the removal-reason names kept in the shell are held equal to oa-truth's.
[dev-dependencies]
oa-truth = { path = "../oa-truth" }

[package.metadata.openatca]
class = "split"
