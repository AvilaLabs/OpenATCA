[package]
name = "oa-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates only; none is an outside dependency (RULESET F1).
oa-feed = { path = "../oa-feed" }
oa-xml = { path = "../oa-xml" }
oa-fixm = { path = "../oa-fixm" }
oa-tbfm = { path = "../oa-tbfm" }
oa-sha256 = { path = "../oa-sha256" }
oa-zip = { path = "../oa-zip" }
oa-adsb = { path = "../oa-adsb" }
oa-tfms = { path = "../oa-tfms" }
oa-notam = { path = "../oa-notam" }
oa-sealed = { path = "../oa-sealed" }

[dev-dependencies]
# F1a: guarded public-snapshot cross-check for the NOTAM compatibility test only.
oa-airspace = { path = "../oa-airspace" }
# Workspace crate: compresses test recordings to .oaf.gz.
oa-deflate = { path = "../oa-deflate" }
oa-time-window = { path = "../oa-time-window" }

[package.metadata.openatca]
class = "split"
