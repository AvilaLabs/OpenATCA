[package]
name = "openatca-core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Provisional C ABI shell for selected OpenATCA L0 math, integrity, geodesy, compression, archive metadata, and text parsing"

[package.metadata.openatca]
class = "shell"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
# F1: these four dependencies are existing core implementations, not new algorithms: oa-geo
# provides validated geometry, oa-ieee and oa-math preserve source-defined scalar semantics, and
# oa-sha256 provides integrity hashing. The shell only adapts pointers and fixed-width values.
oa-geo = { path = "../oa-geo" }
oa-ieee = { path = "../oa-ieee" }
oa-math = { path = "../oa-math" }
oa-sha256 = { path = "../oa-sha256" }
# F1: bounded one-shot C bindings delegate to these existing parser implementations.
oa-csv = { path = "../oa-csv" }
oa-json = { path = "../oa-json" }
oa-xml = { path = "../oa-xml" }
# F1a: ZIP metadata/extraction bindings delegate to oa-zip's bounded directory checks and inflater.
oa-zip = { path = "../oa-zip" }
# F1a: one-shot C wrapper delegates raw-DEFLATE encoding to the existing streaming compressor.
oa-deflate = { path = "../oa-deflate" }
# F1a: bounded metadata-only tar facade delegates parsing to the existing streaming reader.
oa-tar = { path = "../oa-tar" }
# F1a: bounded FNS AIXM NOTAM binding delegates decoding to the existing profile decoder.
oa-notam = { path = "../oa-notam" }
# F1a: the caller supplies an explicit neutral interval; tools remain responsible for their own sealed-data policy.
oa-time-window = { path = "../oa-time-window" }
# F1a: fixed C/ctypes projection delegates bounded decode to the existing ASTERIX core.
oa-asterix = { path = "../oa-asterix" }
# F1a: the GRIB2 binding projects the existing bounded Preview decoder; it adds no decoder.
oa-grib2 = { path = "../oa-grib2" }
# F1a: the CIFP binding projects the existing FAA ARINC 424-18 decoder only.
oa-arinc424 = { path = "../oa-arinc424" }
