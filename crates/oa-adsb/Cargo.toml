[package]
name = "oa-adsb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crate, not an outside dependency (RULESET F1): the sealed hold-out guard every input path is opened through.
oa-sealed = { path = "../oa-sealed" }
# Workspace crates; not outside dependencies (RULESET F1).
oa-json = { path = "../oa-json" }
oa-tar = { path = "../oa-tar" }
oa-zip = { path = "../oa-zip" }
oa-feed = { path = "../oa-feed" }
# Workspace crate, not an outside dependency (RULESET F1): digests the inputs named in the clip's .source sidecar.
oa-sha256 = { path = "../oa-sha256" }

[[bin]]
name = "oa-adsb-clip"
path = "src/main.rs"

[package.metadata.openatca]
class = "shell"
