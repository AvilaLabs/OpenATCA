[package]
name = "oa-airspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Airspace and procedure models used by documented NOTAM geometry operations"
documentation = "https://github.com/AvilaLabs/OpenATCA/blob/main/docs/core-api/modules/airspace.md"
readme = "README.md"

[lints]
workspace = true

[dependencies]
oa-csv = { path = "../oa-csv" }
oa-geo = { path = "../oa-geo" }
oa-nasr = { path = "../oa-nasr" }
oa-arinc424 = { path = "../oa-arinc424" }
oa-sha256 = { path = "../oa-sha256" }
oa-zip = { path = "../oa-zip" }
# Workspace crates (platform-independent maths, B6, B10); not outside dependencies (RULESET F1).
oa-math = { path = "../oa-math" }
oa-ieee = { path = "../oa-ieee" }

[package.metadata.openatca]
class = "split"
candidate_package_name = "openatca-airspace"
release_profile = "supporting-dependency-candidate"
api_tier = "preview"
api_document = "docs/core-api/modules/airspace.md"
