[package]
name = "oa-feed-work-check"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
# F1: validation-only path to the frame reader under measurement; no outside crate.
oa-feed = { path = "../../crates/oa-feed" }

[profile.release]
debug = 1
overflow-checks = true
