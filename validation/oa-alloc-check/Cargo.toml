[package]
name = "oa-alloc-check"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
# F1: validation-only links to the existing local core; no external or product dependency.
oa-track = { path = "../../crates/oa-track" }
# F1: the NAM session core, also by local path only.
oa-nam = { path = "../../crates/oa-nam" }

[profile.release]
debug = 1
overflow-checks = true
