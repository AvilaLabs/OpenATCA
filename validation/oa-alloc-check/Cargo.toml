[package]
name = "oa-alloc-check"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
# F1: validation-only links to the existing local core; no external or product dependency.
oa-track = { path = "../../crates/oa-track" }
# F1: the NAM session core, also by local path only.
oa-nam = { path = "../../crates/oa-nam" }

# F1: the display core and the replay shell, and what their fixtures use, by local path only.
oa-display = { path = "../../crates/oa-display" }
oa-scope-replay = { path = "../../crates/oa-scope-replay" }
oa-airspace = { path = "../../crates/oa-airspace" }
oa-geo = { path = "../../crates/oa-geo" }
# F1: the safety-net state and inhibition core, by local path only.
oa-safety = { path = "../../crates/oa-safety" }
oa-migration = { path = "../../crates/oa-migration" }
oa-migration-switch = { path = "../../crates/oa-migration-switch" }

[profile.release]
debug = 1
overflow-checks = true
